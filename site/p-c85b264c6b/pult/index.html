<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт MAMAY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Макет мобильного приложения владельца: шапка с проектом, экран, нижняя панель разделов. Тёмная основа MAMAY, золото — цвет проекта. */
:root {
  --bg: #f4f2ed; --panel: #ffffff; --panel2: #ece8df; --line: #ddd6c7;
  --fg: #1a1814; --muted: #6d665a; --dim: #9a9282;
  --gold: #a87a1e; --gold-soft: rgba(168,122,30,.12);
  --ok: #1e7a4c; --ok-soft: rgba(30,122,76,.12);
  --warn: #a8641a; --warn-soft: rgba(168,100,26,.13);
  --bad: #b23a2e; --bad-soft: rgba(178,58,46,.11);
  --info: #2f6c9c; --info-soft: rgba(47,108,156,.12);
  --rose: #b0476b; --rose-soft: rgba(176,71,107,.12); --vk: #3f6fa8;
  --shadow: 0 1px 2px rgba(40,30,10,.06);
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --acc: var(--gold); --acc-soft: var(--gold-soft);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07090d; --panel: #10131a; --panel2: #171b24; --line: #252a35;
  --fg: #efe6d2; --muted: #a39a88; --dim: #6d675b;
  --gold: #e8c366; --gold-soft: rgba(232,195,102,.12);
  --ok: #55c98d; --ok-soft: rgba(85,201,141,.13);
  --warn: #f0a24a; --warn-soft: rgba(240,162,74,.13);
  --bad: #ef6b5e; --bad-soft: rgba(239,107,94,.13);
  --info: #6fb3e8; --info-soft: rgba(111,179,232,.13);
  --rose: #ec8fae; --rose-soft: rgba(236,143,174,.13); --vk: #84aee0;
  --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #07090d; --panel: #10131a; --panel2: #171b24; --line: #252a35;
  --fg: #efe6d2; --muted: #a39a88; --dim: #6d675b;
  --gold: #e8c366; --gold-soft: rgba(232,195,102,.12);
  --ok: #55c98d; --ok-soft: rgba(85,201,141,.13);
  --warn: #f0a24a; --warn-soft: rgba(240,162,74,.13);
  --bad: #ef6b5e; --bad-soft: rgba(239,107,94,.13);
  --info: #6fb3e8; --info-soft: rgba(111,179,232,.13);
  --rose: #ec8fae; --rose-soft: rgba(236,143,174,.13); --vk: #84aee0;
  --shadow: none; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; }

/* шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.proj { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 4px 8px 4px 4px; }
.i-sun { display: none; }
:root[data-theme="dark"] .i-moon { display: none; } :root[data-theme="dark"] .i-sun { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-moon { display: none; } :root:not([data-theme="light"]) .i-sun { display: block; } }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc);
  font-family: var(--serif); font-weight: 700; font-size: 22px; }
.proj b { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.proj small { display: block; color: var(--muted); font-size: 12px; margin-top: -3px; }
.top .sp { flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; position: relative; }
.iconbtn:hover { background: var(--panel2); }
.iconbtn svg { width: 21px; height: 21px; }
.dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff;
  font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.demo { margin: 8px max(16px, env(safe-area-inset-left, 0px)) 0; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.demo i { font-style: normal; padding: 1px 7px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }

/* экран */
main { flex: 1; padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; margin: -6px 0 0; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--acc-soft); border-color: transparent; color: var(--acc); }
.chip .n { font-family: var(--mono); font-size: 11px; margin-left: 4px; opacity: .8; }

/* список сообщений */
.list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; padding: 12px; text-align: left; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel2); }
.row.unread .who b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); margin-left: 6px; vertical-align: 2px; }
.ch { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.ch svg { width: 18px; height: 18px; }
.c-mamay { background: var(--gold-soft); color: var(--gold); } .c-beta { background: var(--warn-soft); color: var(--warn); }
.c-mail { background: var(--info-soft); color: var(--info); } .c-tg { background: var(--info-soft); color: var(--info); }
.c-yt { background: var(--bad-soft); color: var(--bad); } .c-tt { background: var(--rose-soft); color: var(--rose); } .c-site { background: var(--ok-soft); color: var(--ok); } .c-vk { background: var(--info-soft); color: var(--vk); }
.head { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.who b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 70%; }
.who span { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
.txt { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.time { color: var(--dim); font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel2); color: var(--muted); }
.t-bug { background: var(--bad-soft); color: var(--bad); } .t-idea { background: var(--ok-soft); color: var(--ok); }
.t-q { background: var(--info-soft); color: var(--info); } .t-new { background: var(--acc-soft); color: var(--acc); }
.t-beta { background: var(--warn-soft); color: var(--warn); } .t-neg { background: var(--bad-soft); color: var(--bad); }
.t-pos { background: var(--ok-soft); color: var(--ok); }
.t-react { background: var(--panel2); color: var(--muted); }
.fstep.wide { grid-template-columns: 150px minmax(0,1fr) 62px; }
.mrow { display: grid; grid-template-columns: minmax(0,1fr) 40px 62px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mrow small { display: block; color: var(--muted); font-size: 12px; } .mrow b { text-align: right; font-variant-numeric: tabular-nums; }
.mrow4 { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; }
.mrow4 .head { gap: 8px; } .mrow4 .ch { width: 26px; height: 26px; border-radius: 8px; flex: none; } .mrow4 .ch svg { width: 14px; height: 14px; }
.mrow4 .ctitle { font-size: 13.5px; flex: 1; min-width: 0; } .mtot { font-size: 14px; font-variant-numeric: tabular-nums; }
.mnums { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--muted); padding-left: 34px; } .mnums b { color: var(--fg); font-variant-numeric: tabular-nums; }
.deal { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; }
.dsteps { display: flex; flex-wrap: wrap; gap: 4px; } .dsteps span { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--panel2); color: var(--dim); }
.dsteps span.done { background: var(--ok-soft); color: var(--ok); }
.prog { height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--acc); }
.rxrow { display: flex; flex-wrap: wrap; gap: 6px; }
.rxc { padding: 4px 9px; border-radius: 10px; background: var(--panel2); font-size: 14px; }
.rxc b { font-size: 12.5px; font-variant-numeric: tabular-nums; } .rxc.neg { background: var(--bad-soft); }
.chain { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 2px; text-align: center; background: var(--panel2); border-radius: 10px; padding: 7px 2px; }
.chain div { position: relative; } .chain div + div::before { content: "›"; position: absolute; left: -4px; top: 1px; color: var(--dim); }
.chain b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; } .chain span { font-size: 9.5px; color: var(--dim); line-height: 1.1; display: block; }
.linkline { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--acc-soft); border-radius: 10px; padding: 6px 6px 6px 10px; }
.linkline span { font-family: var(--mono); font-size: 12.5px; color: var(--acc); overflow-wrap: anywhere; } .linkline .btn { padding: 7px 10px; font-size: 12.5px; flex: none; }
.lrow { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.tpls button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); }
.hidden-note { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.hidden-note button { color: var(--acc); font-weight: 700; font-size: 12.5px; }

/* карточка */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 0; align-self: flex-start; }
.msg { font-size: 15.5px; line-height: 1.55; }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.voice { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: var(--panel2); }
.play { width: 36px; height: 36px; border-radius: 50%; background: var(--acc); color: var(--bg); display: grid; place-items: center; flex: none; }
.wave { flex: 1; height: 28px; display: flex; align-items: center; gap: 2px; min-width: 0; }
.wave i { flex: 1; background: var(--acc); opacity: .55; border-radius: 2px; }
.voice .time { color: var(--muted); }
.shot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel2); }
.shot svg { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 12px; color: var(--muted); padding: 8px 10px; }
.ai { border-left: 0; background: var(--acc-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.ai b { color: var(--acc); }
.labels { display: flex; flex-wrap: wrap; gap: 6px; }
.labels button { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); }
.labels button.on { border-style: solid; border-color: transparent; background: var(--acc-soft); color: var(--acc); }
details { font-size: 13px; } summary { cursor: pointer; color: var(--muted); font-weight: 600; }
details pre { font-family: var(--mono); font-size: 11.5px; background: var(--panel2); padding: 10px; border-radius: 10px; overflow-x: auto; white-space: pre; margin: 8px 0 0; }
.tpls { display: flex; gap: 6px; flex-wrap: wrap; }
.tpls button { font-size: 12.5px; padding: 6px 10px; border-radius: 9px; background: var(--panel2); font-weight: 600; }
input[type="email"] { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 10px 12px; font: inherit; font-size: 14px; }
.chips.sub { margin-top: -4px; }
.chrow.boxrow { grid-template-columns: 34px minmax(0,1fr); } .boxrow .addr { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .boxrow .pill { display: inline-block; margin-top: 4px; } .chips.sub .chip { font-size: 12px; padding: 5px 10px; }
textarea { width: 100%; min-height: 92px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); padding: 10px 12px; font: inherit; font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 14.5px; }
.btn.pri { background: var(--acc); color: var(--bg); } .btn.sec { background: var(--panel2); }
.btn.okb { background: var(--ok-soft); color: var(--ok); } .btn.badb { background: var(--bad-soft); color: var(--bad); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; } .actions .btn { flex: 1 1 auto; }
.note { font-size: 12.5px; color: var(--muted); }

/* темы */
.theme { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; padding: 12px; border-top: 1px solid var(--line); text-align: left; align-items: center; }
.theme:first-child { border-top: 0; } .theme:hover { background: var(--panel2); }
.votes { text-align: center; } .votes b { font-family: var(--sans); font-weight: 800; font-size: 26px; line-height: 1; display: block; color: var(--acc); font-variant-numeric: lining-nums tabular-nums; }
.votes span { font-size: 11px; color: var(--dim); }
.votes em { display: block; font-style: normal; font-size: 11px; font-weight: 800; margin-top: 3px; color: var(--ok); }
.votes em.zero { color: var(--dim); font-weight: 600; }
.t-hot { background: var(--warn-soft); color: var(--warn); } .t-cold { background: var(--panel2); color: var(--dim); }
.theme .meta { margin-top: 5px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 18px; margin-top: 6px; }
.spark i { flex: 1; background: var(--acc); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .45; }
.spark i.now { opacity: 1; }
.spark i.hot { background: var(--warn); opacity: 1; }
.sparkl { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
.chart svg .tap { cursor: pointer; }
.dayinfo { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.dayhead { display: flex; gap: 8px; align-items: center; }
.when { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.when div { background: var(--panel2); border-radius: 10px; padding: 8px; }
.when span { display: block; font-size: 11.5px; color: var(--muted); } .when b { font-size: 14px; font-variant-numeric: tabular-nums; }
.adate { margin-left: auto; color: var(--dim); font-size: 12px; font-family: var(--mono); }
.fresh-sep { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.seg.two { grid-template-columns: repeat(3, 1fr); }
/* каналы */
.conn { width: 100%; text-align: left; }
.conn:hover { background: var(--panel2); }
.pill { font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 7px; white-space: nowrap; font-family: var(--sans); }
.p-on { background: var(--ok-soft); color: var(--ok); } .p-off { background: var(--panel2); color: var(--dim); }
.p-man { background: var(--warn-soft); color: var(--warn); } .p-pause { background: var(--info-soft); color: var(--info); }
.steps { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.gives { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet .head { margin-bottom: 4px; }
.theme h3 { margin: 0; font-size: 14.5px; line-height: 1.3; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 7px; background: var(--panel2); }
.bar i { display: block; height: 100%; }
.st { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 7px; white-space: nowrap; }
.s-new { background: var(--acc-soft); color: var(--acc); } .s-work { background: var(--info-soft); color: var(--info); }
.s-done { background: var(--ok-soft); color: var(--ok); } .s-no { background: var(--panel2); color: var(--dim); }
select { font: inherit; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.authors { display: flex; flex-direction: column; gap: 6px; }
.author { display: flex; align-items: center; gap: 8px; font-size: 13px; } .author .ch { width: 26px; height: 26px; border-radius: 8px; font-size: 10px; }
.author .ch svg { width: 14px; height: 14px; }
.preview { background: var(--panel2); border-radius: 12px; padding: 12px; font-size: 14px; }

/* статистика */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel2); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.five { grid-template-columns: repeat(3, 1fr); }
.sbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; } .sbar i { display: block; height: 100%; background: var(--acc); opacity: .85; } .sbar i.fem { background: var(--rose); }
.fstep.num b small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; line-height: 1.1; }
.fstep.num { grid-template-columns: 112px minmax(0,1fr) 52px; }
.agenum { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); padding-left: 120px; margin: -3px 0 3px; }
.agenum .am::before, .agenum .af::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; background: var(--acc); }
.agenum .af::before { background: var(--rose); }
.hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; } .hours i { height: 26px; border-radius: 3px; background: var(--acc); }
.hlab { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); }
.tips { margin: 0; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
b.up { color: var(--ok); } b.down { color: var(--bad); }
.ctitle { display: block; font-size: 14px; line-height: 1.3; }
.seg button { padding: 8px 4px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }

    }
    if (t.hasAttribute("data-send")) return toast("В макете ничего не отправляется. В приложении ответ уйдёт автору по вашей кнопке.");
    if (t.hasAttribute("data-newtheme")) return toast("Тема создана из сообщения — похожие сообщения ИИ предложит добавить.");
    if (t.hasAttribute("data-play")) return toast("Здесь проигрывается запись голоса.");
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "sortSel") { state.sort = e.target.value; themes(); }
    if (e.target.id === "csSel") { state.cs = e.target.value; stats(); }
    if (e.target.id === "lkSel") linkSheet(e.target.value || null);
  });
  badge(); render();
})();
</script>
